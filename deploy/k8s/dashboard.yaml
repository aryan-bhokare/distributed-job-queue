apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  labels: { app: dashboard }
spec:
  replicas: 1
  selector: { matchLabels: { app: dashboard } }
  template:
    metadata:
      labels: { app: dashboard }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: dashboard
          image: distributed-job-queue:latest
          imagePullPolicy: IfNotPresent # image is the default ENTRYPOINT (dashboard)
          env:
            - { name: REDIS_ADDR, value: "redis:6379" }
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
spec:
  selector: { app: dashboard }
  ports: [{ port: 80, targetPort: 8080 }]
  type: ClusterIP
