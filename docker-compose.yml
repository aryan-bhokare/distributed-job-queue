# Phase 1: just Redis. Run the Go binaries locally against it:
#
#   docker compose up -d
#   go run ./cmd/worker                                              # terminal 1
#   go run ./cmd/enqueue send_email '{"to":"a@b.com","template":"x"}' # terminal 2
#
# If host port 6379 is already taken (other Redis containers), pick another:
#   REDIS_PORT=6380 docker compose up -d
#   REDIS_ADDR=localhost:6380 go run ./cmd/worker
#
# The Go app itself gets containerized in Phase 9 (multi-stage Dockerfile).
services:
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Observability stack — opt-in: `docker compose --profile obs up -d`.
  # Prometheus scrapes the dashboard's /metrics (run `go run ./cmd/demo` on the host).
  prometheus:
    image: prom/prometheus:latest
    profiles: ["obs"]
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    profiles: ["obs"]
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # Fully containerized app — no Go on the host:
  #   docker compose --profile full up --build
  # (add --profile obs too for Prometheus/Grafana). Scale workers with
  #   docker compose --profile full up --build --scale worker=4
  dashboard:
    build: .
    profiles: ["full"]
    environment:
      - REDIS_ADDR=redis:6379
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    profiles: ["full"]
    # Override ENTRYPOINT (not command) — command would just append an arg to the
    # dashboard entrypoint. entrypoint replaces the binary that runs.
    entrypoint: ["/usr/local/bin/worker"]
    environment:
      - REDIS_ADDR=redis:6379
      - WORKER_CONCURRENCY=5
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 2

volumes:
  redis-data:
